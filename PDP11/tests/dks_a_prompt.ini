; dks_a_prompt.ini - stage A: standalone DKS with the TESTOS prompt
; dialog.  Telnet to the port: the Э-60 assigns an OS terminal, prints
; "E60 DKS ready" and the "DKS> " prompt; every finished line gets a new
; prompt as the "operating system" reply.
set dks enable
set dks engine=sim
set dks testos=prompt
set dks debug=ring;proto;data
set debug stdout
attach dks 4000
show dks
deposit 200 0777
go 200
