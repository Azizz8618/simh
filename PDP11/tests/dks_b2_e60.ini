; dks_b2_e60.ini - the Э-60 side of the stage B2 bridge test.
;
; The DKS runs with the C engine (SIM) and TESTOS off: the "operating
; system" is the БЭСМ-6 program in dks_b2_besm6.ini, connected through
; the КАДОПАМ bridge.  Telnet to port 4000, type HELLO, see HELLO back.
;
; The CPU runs an idle loop (BR . = 0777) so the unit service ticks.
set dks enable
set dks engine=sim
set dks testos=off
set dks bridge=4140
set dks debug=bridge;ring;irq;kadopam
set debug stdout
attach dks 4000
show dks
deposit 200 0777
go 200
