; dks_a_smoke.ini - stage A smoke test: standalone DKS with the TESTOS
; echo loop.  Telnet to the port: every typed line comes back as an
; output array produced by the "operating system".
;
;   sim> ATTACH DKS 4000 ... telnet localhost 4000, type HELLO, see HELLO
;
; The CPU runs an idle loop (BR . = 0777) so the unit service ticks.
set dks enable
set dks engine=sim
set dks testos=on
set dks debug=ring;proto
set debug stdout
attach dks 4000
show dks
deposit 200 0777
go 200
