; dks_b2_e60_fw.ini - stage B1+B2: the Э-60 firmware (ENGINE=HOST)
; speaks the СВЯЗЬ7 protocol through the КАДОПАМ bridge with the
; БЭСМ-6, whose side is the ОС-заглушка (dks_b2_besm6.ini).  No TESTOS:
; with TESTOS=OFF the engine posts into the bridge.
;
;   telnet localhost 4000: connect -> the ОС echoes every line back.
set cpu 64k
set clk disable
set ptr disable
set ptp disable
set lpt disable
set rha disable
set rk disable
set dz disable
set dks enable
set dks engine=host
set dks testos=off
set dks bridge=4140
set dks address=17760540
set dks vector=300
set dks debug=bridge;ring;irq;data
set debug stdout
attach dks 4000
show dks
load PDP11/dks_fw.bin
go
