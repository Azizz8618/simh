; dks_b1_fw.ini - stage B1: the СВЯЗЬ7 engine is the Э-60 firmware
; running on the CPU (SET DKS ENGINE=HOST), the device is only the
; hardware.  The "operating system" is the TESTOS stub of the device.
;
;   sim> ATTACH DKS 4000 ... telnet localhost 4000: connect ->
;   "E60 DKS ready", "DKS> ", typing is echoed by the firmware.
;
; The firmware (PDP11/dks_fw.bin) is loaded in the absolute-loader
; format; the end block sets PC to 01000 (START).  Vectors 0300/0304
; point at the RTI stubs, the device must be told the same numbers.
set cpu 64k
set clk disable
set ptr disable
set ptp disable
set lpt disable
set rha disable
set rk disable
set dz disable
set dks enable
set dks engine=host
set dks testos=prompt
set dks address=17760540
set dks vector=300
set dks debug=ring;irq;data
set debug stdout
attach dks 4000
show dks
load PDP11/dks_fw.bin
go
