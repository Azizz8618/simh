; dks_b2_shm_e60.ini - the Э-60 side of the SHMEM acceptance test:
; the ОЗУ Э-60 is published as POSIX shared memory and the БЭСМ-6 maps
; it directly (SET DKS SHMEM) - КАДОПАМ without a network.  The engine
; is in C (SIM), TESTOS off: the "operating system" is the БЭСМ-6
; program in dks_b2_shm_besm6.ini.  Telnet to port 4000, type HELLO.
;
; The CPU runs an idle loop (BR . = 0777) so the unit service ticks.
set dks enable
set dks engine=sim
set dks testos=off
set dks shmem=/dks_b2_t0
set dks debug=bridge;ring;irq;kadopam
set debug stdout
attach dks 4000
show dks
deposit 200 0777
go 200
