; dks_doorbell.ini - T8: the doorbell with extra diagnostic bits.
; KADDR = 077777 (адркс), KDATA = 0777: bit 0400 rings the E-60,
; the other bits leave a diagnostic trace (like the reference).
set dks enable
set dks debug=kadopam;ring;irq
set debug stdout
attach dks 4000
deposit 200 012737
deposit 202 077777
deposit 204 160550
deposit 206 012737
deposit 210 00777
deposit 212 160552
go 200
