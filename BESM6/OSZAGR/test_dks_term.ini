; test_dks_term.ini — Тест терминалов АС,ТТ через ДКС (КАДОПАМ/СВЯЗЬ7)
; Диск 2053 сгенерирован: ./scripts/gens.sh run gens_exp (ШКУТ биты 11-16)
; Соответствие ГЕНС ⇄ INI:
;   ГЕНС: TT 1            → tty1  = tt + console (локальный ТТ)
;   ГЕНС: ТЕРМ VT:1-10    → tty2-10 = vt (локальный ВТ-340)
;   ГЕНС: ТЕРМ АС,ТТ:11-16 → tty11-16 = tt + dks (через ДКС/СВЯЗЬ7)
;
set -n console log=/tmp/besm6_dks_log.txt
set console debug=/tmp/besm6_dks_debug.txt
set cpu idle
set cpu autotime=on

; Барабаны
attach -n drum0 drum1x.bin
attach -n drum1 drum2x.bin

; Рабочий диск
attach -n md06 2052.bin

; Системный диск 2053 — сгенерированный ГЕНС (ШКУТ биты 11-16 установлены)
attach -e md07 /usr/local/share/besm6/2053
; Дополнительные системные диски
attach -e md05 krab2063.bin
attach -e md00 sbor2048.bin
attach -e md01 svs2048.bin
attach -e md02 alt2048.bin

; Печать
attach -n prn0 /tmp/besm6_dks_output.txt

; Telnet-сокет для всех терминалов
attach tty 4199

; ===== Линия 1: главный телетайп (консоль оператора) =====
; ГЕНС: TT 1
attach tty1 console
set tty1 tt
set tty1 authbs

; ===== Линии 2-10: ВТ-340 (локальные) =====
; ГЕНС: ТЕРМ VT:1-10
set tty2 vt
set tty2 authbs
set tty3 vt
set tty3 authbs
set tty4 vt
set tty4 authbs
set tty5 vt
set tty5 authbs
set tty6 vt
set tty6 authbs
set tty7 vt
set tty7 authbs
set tty8 vt
set tty8 authbs
set tty9 vt
set tty9 authbs
set tty10 vt
set tty10 authbs

; ===== Линии 11-16: ТТ через ДКС (АС — аппаратура сопряжения) =====
; ГЕНС: ТЕРМ АС,ТТ:11-16 → ШКУТ → ДКС → СВЯЗЬ7
; ВАЖНО: НЕ ставить "set ttyN tt" на DKS-линии! tty_setmode для
; TTY_TELETYPE_STATE ставит .conn=1 (локальная занятая линия), и
; tmxr_poll_conn никогда не отдаст такую линию telnet-подключению.
; DKS-линии должны оставаться свободными (conn=0) для удалённых терминалов.
set tty11 dks
set tty11 authbs
set tty12 dks
set tty12 authbs
set tty13 dks
set tty13 authbs
set tty14 dks
set tty14 authbs
set tty15 dks
set tty15 authbs
set tty16 dks
set tty16 authbs

; ===== Линия 17: свободная (ДКС — доп. тест) =====
set tty17 dks
set tty17 authbs

; ===== Линии 18-24: свободные =====
set tty18 authbs
set tty19 authbs
set tty20 authbs
set tty21 authbs
set tty22 authbs
set tty23 authbs
set tty24 authbs

; Отладка: файл debug уже открыт выше (set console debug=...).
; "set tty debug" НЕ нужен: besm6_debug (">>> DKS: ...") пишет в debug-файл
; безусловно, а трассировка TTY даёт ~6 МБ мусора на прогон (замедляет grep).

echo ###
echo ### Загрузка ОС Диспак (диск 2053, ГЕНС gens_exp)...
echo ### Нулевикация ОЗУ...

d -ml 1 xta, vtm 1777(1)
d -ml 2 atx (1), utm -1(1)
d -ml 3 v1m 2(1), stop
run 1

echo ###
echo ### ОЗУ обнулено. Загрузка ОС...
echo ###

load boot_dispak.b6
run 2000