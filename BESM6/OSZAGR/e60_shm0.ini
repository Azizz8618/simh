; e60_shm0.ini - Э-60 варианта с прямым доступом к памяти: ОЗУ Э-60
; публикуется как POSIX-сегмент /dks0 (канал КРК 2); БЭСМ-6
; (dks_os_shm.ini) отображает его и работает с общими байтами.
; Прошивка/движок и терминалы - как в e60_R0.ini.
;
; Экономия хостовых ядер: пока ДКС тих, служба устройства тянется
; 1,1,2,2,4,4,8... мс до POLLMAX (первое событие после паузы ждёт
; до POLLMAX-1 мс), а процессор спит по WAIT + SET CPU IDLE - раньше
; здесь крутился BR . (0777) на полном ходу, ~0.7 CPU/с на каждый Э-60.

de int-flush flush_interval 1
set dks enable
set dks engine=sim
set dks testos=off
set dks shmem=/dks0
set dks encoding=utf8
set cpu idle
set dks pollmax=8
attach dks 4300
deposit 200 000001          ; WAIT - спим до события, будит служба ДКС
go 200
