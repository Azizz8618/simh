; Эталонная связка БЭСМ-6 <-> Э-60 (ДКС): сторона БЭСМ-6 с ОС Диспак,
; терминалы за концентраторами Э-60 через мост КАДОПАМ (SET DKS REMOTE).
; Проверено 2026-11-06 реальной загрузкой Диспака с дисками заказчика
; (системный МД 2053, МД 2048, МД архива 2095); см. ОТЧЁТ_О_ТЕСТАХ.md
; связки и Приказы_Диспак_через_ДКС_тесты_и_задержки.md.
;
; Файлы в текущем каталоге при запуске:
;   boot_dispak.b6  - загрузчик (копия из BESM6/boot_dispak.b6);
;   2053, 2048, 2095 - образы МД (имя файла = номер тома);
;   2052.bin, drum1x.bin, drum2x.bin, output_R.txt - создаются при запуске.
;
; Запуск:
;   ./BIN/pdp11 BESM6/e60_R0.ini        # Э-60 N1: мост 4140, telnet 4300
;   ./BIN/pdp11 BESM6/e60_R1.ini        # Э-60 N2: мост 4141, telnet 4301
;   ./BIN/besm6  BESM6/dks_os_R.ini     # Диспак (порядок запуска не
;                                       # критичен: мост переподключается)
;   Терминал: telnet localhost 4300 (или 4301) -> терминал Диспака за Э-60.
;   Пульт оператора: окно симулятора БЭСМ-6 - attach tty1 console подключает
;   его к линии T001 (telnet-клиенты мукса 4198 пульт не отнимают, пока это
;   подключение активно).  Из пульта работает диалог загрузки (ДАТА/ВРЕМЯ).
;   Примечание: данная сборка Диспака отвечает ДКС только по каналу 2 (ПРП6);
;   запросы канала 3 остаются без ответа.
;   Журналы: logs/log_R.txt (консоль БЭСМ-6 + трасса КАДОПАМ), e60_R0.mux, e60_R1.mux.
;
de int-flush flush_interval 1
set -n console log=logs/log_R.txt
set cpu idle
set cpu autotime=on

attach -n drum0 drum1x.bin
attach -n drum1 drum2x.bin
attach -n md06 2052.bin
attach -e md07 2053
attach -e md00 2048
; the archive volume 2095 (supplied by the user): the OS asks for it
; ("УСТ.МД АРХИВА / УСТ СРЧ.К40Б2095") at boot
attach -e md05 2095
attach -n prn0 output_R.txt

attach tty1 4198
set tty2 vt
set tty3 vt
set tty4 vt
set tty5 vt
set tty6 vt
set tty7 vt
set tty8 vt
set tty9 vt
set tty10 vt
set tty11 tt
set tty11 dks
set tty11 authbs
set tty12 tt
set tty12 dks
set tty12 authbs
set tty13 tt
set tty13 dks
set tty13 authbs
set tty14 tt
set tty14 dks
set tty14 authbs
set tty15 tt
set tty15 dks
set tty15 authbs
set tty16 tt
set tty16 dks
set tty16 authbs
set tty17 vt
set tty17 dks
set tty17 authbs

attach tty1 console

set dks enable
set dks remote=localhost:4140
set dks chans=2
set dks debug=kadopam;ring;irq;bridge
; the trace goes into the console (mux) log: sim_log is fflushed at
; every simulation stop, while a debug FILE would sit in a stdio
; buffer that simh never flushes; -F keeps every line (no dedup) so
; occurrence counts stay meaningful
set debug -F LOG

echo ###
echo ### Zeroing the first page of RAM
echo ###
d -ml 1 xta, vtm 1777(1)
d -ml 2 atx (1), utm -1(1)
d -ml 3 v1m 2(1), stop
run 1

echo ###
echo ### Booting OS Dispak from disk 2053
echo ###
load boot_dispak.b6
run 2000
