; test_dks_after_os.ini — Тест DKS после загрузки ОС
; Этот тест загружает ОС, затем ожидает telnet-подключения для DKS

set -n console log=/tmp/besm6_dks_after_os.log
set console debug=/tmp/besm6_dks_after_os_debug.txt
set cpu idle
set cpu autotime=on

; Барабаны
attach -n drum0 drum1x.bin
attach -n drum1 drum2x.bin

; Рабочий диск
attach -n md06 2052.bin

; Системный диск 2053 — сгенерированный ГЕНС (ШКУТ биты 11-16 установлены)
attach -e md07 /usr/local/share/besm6/2053

; Печать
attach -n prn0 /tmp/besm6_dks_after_os_output.txt

; Telnet-сокет для всех терминалов
attach tty 4199

; ===== Линия 11: ТТ через ДКС (АС — аппаратура сопряжения) =====
; ГЕНС: ТЕРМ АС,ТТ:11-16 → ШКУТ → ДКС → СВЯЗЬ7
set tty11 dks
set tty11 authbs

echo ###
echo ### Загрузка ОС Диспак...
echo ###

; Загрузка ОС
load boot_dispak.b6
run 2000

echo ###
echo ### ОС загружена. Ожидание telnet-подключений...
echo ### Подключитесь к порту 4199 для DKS-терминала
echo ###

; Ожидание telnet-соединения
run 1000

echo ###
echo ### Подключение получено, проверка DKS-регистрации...
echo ###

; Проверка, что DKS-регистрация произошла
d -ml 1 xta, vtm 1777(1)
d -ml 2 atx (1), utm -1(1)
d -ml 3 v1m 2(1), stop
run 1