; dispak_tmux.ini — ОС ДИСПАК + КРАБ, эмулятор в tmux (консоль оператора доступна)
;
; Отличие от dispak.ini:
;   * `set console log=logs/log.txt`  — консоль пишется в журнал (logs/);
;   * `attach tty1 console` — операторская консоль Т001 остаётся в панели tmux,
;     ей можно управлять через `tmux send-keys` / `tmux capture-pane`;
;   * убран неработающий `attach -e mg57 .../ML/204` (файла нет).

set console log=logs/log.txt
set console wru=7
set autotime=on

;
; Initializing the magnetic drums.
;
attach -n drum0 /home/azizz/Yandex.Disk/simh/BESM6/MB/drum1x.bin
attach -n drum1 /home/azizz/Yandex.Disk/simh/BESM6/MB/drum2x.bin

;
; Initializing a scratch disk.
;
attach -n md06 /home/azizz/Yandex.Disk/simh/BESM6/MD/2052

;
; Attaching system disks.
;
set md1 ec-5061
set md4 ec-5061
attach -e md01 /home/azizz/Yandex.Disk/simh/BESM6/MD/2148
attach -r md02 /home/azizz/Yandex.Disk/simh/BESM6/MD/2248
attach -e md04 /home/azizz/Yandex.Disk/simh/BESM6/MD/2095
attach -e md05 /home/azizz/Yandex.Disk/simh/BESM6/MD/2063
attach -e md07 /home/azizz/Yandex.Disk/simh/BESM6/MD/2253
attach -e md21 /home/azizz/Yandex.Disk/simh/BESM6/MD/2061
attach -e md41 /home/azizz/Yandex.Disk/simh/BESM6/MD/EC5061/2070
attach -e md42 /home/azizz/Yandex.Disk/simh/BESM6/MD/EC5061/2094
attach -e md43 /home/azizz/Yandex.Disk/simh/BESM6/MD/EC5061/2086
attach -e md44 /home/azizz/Yandex.Disk/simh/BESM6/MD/RAK/2073
attach -e md45  /home/azizz/Yandex.Disk/simh/BESM6/MD/EC5061/2348
set mg4 es
attach -r mg43 /home/azizz/Yandex.Disk/simh/BESM6/ML/208
attach -r mg44 /home/azizz/Yandex.Disk/simh/BESM6/ML/210
attach -r mg50 /home/azizz/Yandex.Disk/simh/BESM6/ML/209
attach -r mg51 /home/azizz/Yandex.Disk/simh/BESM6/ML/211
attach -r mg52 /home/azizz/Yandex.Disk/simh/BESM6/ML/212
attach -r mg53 /home/azizz/Yandex.Disk/simh/BESM6/ML/213
attach -r mg54 /home/azizz/Yandex.Disk/simh/BESM6/ML/214
attach -e mg55 /home/azizz/Yandex.Disk/simh/BESM6/ML/202
attach -e mg56 /home/azizz/Yandex.Disk/simh/BESM6/ML/203
;attach -e mg57 /home/azizz/Yandex.Disk/simh/BESM6/ML/204   ; файла нет
attach -r mg61 /home/azizz/Yandex.Disk/simh/BESM6/ML/206
attach -r mg62 /home/azizz/Yandex.Disk/simh/BESM6/ML/207

;
; Attaching an output file.
;
attach -n prn0 /home/azizz/Yandex.Disk/simh/BESM6/ACPU/output.txt
attach -n prn1 /home/azizz/Yandex.Disk/simh/BESM6/ACPU/output1.txt
attach -n vu0 /home/azizz/Yandex.Disk/simh/BESM6/UVU/punchcard.txt
attach -n pi0 /home/azizz/Yandex.Disk/simh/BESM6/UVU/punchcard1.txt
attach -n pl0 /home/azizz/Yandex.Disk/simh/BESM6/UVU/punch.txt

;
; Э-60 (ДКС) — линии для терминалов 2-24.
; tty2 — 4199 (игра ДИСПАК), tty3..tty24 — 4202..4223 (ДКС).
;
set dks enabled
set tty2 authbs
attach tty2 Line=2,4199
set tty2 authbs,raw
attach tty3 Line=3,4202
set tty3 dks,raw
attach tty4 Line=4,4203
set tty4 dks,raw
attach tty5 Line=5,4204
set tty5 dks,raw
attach tty6 Line=6,4205
set tty6 dks,raw
attach tty7 Line=7,4206
set tty7 dks,raw
attach tty8 Line=8,4207
set tty8 dks,raw
attach tty9 Line=9,4208
set tty9 dks,raw
attach tty10 Line=10,4209
set tty10 dks,raw
attach tty11 Line=11,4210
set tty11 dks,raw
attach tty12 Line=12,4211
set tty12 dks,raw
attach tty13 Line=13,4212
set tty13 dks,raw
attach tty14 Line=14,4213
set tty14 dks,raw
attach tty15 Line=15,4214
set tty15 dks,raw
attach tty16 Line=16,4215
set tty16 dks,raw
attach tty17 Line=17,4216
set tty17 dks,raw
attach tty18 Line=18,4217
set tty18 dks,raw
attach tty19 Line=19,4218
set tty19 dks,raw
attach tty20 Line=20,4219
set tty20 dks,raw
attach tty21 Line=21,4220
set tty21 dks,raw
attach tty22 Line=22,4221
set tty22 dks,raw
attach tty23 Line=23,4222
set tty23 dks,raw
attach tty24 Line=24,4223
set tty24 dks,raw

;
; Операторская консоль (Т001) — в панели tmux.
;
attach tty1 console
set tty1 unicode,authbs

echo ###
echo ### Zeroing out the first page of RAM (as would be entered from
echo ### switch registers after powering up the machine,
echo ### likely about once a year or less).
echo ###

d -ml 1 xta, vtm 1777(1)
d -ml 2 atx (1), utm -1(1)
d -ml 3 v1m 2(1), stop
run 1

echo ###
echo ### Done; data cache registers are displayed above. An error message
echo ### would be usually displayed there after a STOP instruction.
echo ### Naturally, at the moment they all contain zeros. Booting the OS now...
echo ###
;
; Booting OS DISPAK.
;
load /home/azizz/Yandex.Disk/simh/BESM6/boot_dispak.b6
run 2000
