; test_dks_simple.ini — Минимальный тест DКС (КАДОПАМ-КРК)
; Тест проверяет регистрацию DKS-терминала и генерацию прерываний

set -n console log=/tmp/besm6_dks_simple.log
set console debug=/tmp/besm6_dks_simple_debug.txt
set cpu idle
set cpu autotime=on

; Барабаны
attach -n drum0 drum1x.bin
attach -n drum1 drum2x.bin

; Рабочий диск
attach -n md06 2052.bin

; Системный диск 2053 — сгенерированный ГЕНС (ШКУТ биты 11-16 установлены)
attach -e md07 /usr/local/share/besm6/2053

; Печать
attach -n prn0 /tmp/besm6_dks_simple_output.txt

; Telnet-сокет для всех терминалов
attach tty 4199

; ===== Линия 11: ТТ через ДКС (АС — аппаратура сопряжения) =====
; ГЕНС: ТЕРМ АС,ТТ:11-16 → ШКУТ → ДКС → СВЯЗЬ7
set tty11 dks
set tty11 authbs

echo ###
echo ### Загрузка ОС Диспак (диск 2053, ГЕНС gens_exp)...
echo ### Нулевикация ОЗУ...
echo ###

d -ml 1 xta, vtm 1777(1)
d -ml 2 atx (1), utm -1(1)
d -ml 3 v1m 2(1), stop
run 1

echo ###
echo ### ОЗУ обнулено. Загрузка ОС...
echo ###

load boot_dispak.b6
run 2000