; Эталонная связка БЭСМ-6 <-> Э-60 (ДКС): сторона Э-60 N2 (PDP-11).
; Второй концентратор: мост КАДОПАМ на порту 4141 (клиент канала 3
; на стороне БЭСМ-6: SET DKS CHANS=2, порт base+1), telnet-порт 4301.
;
; Примечание: данная сборка Диспака отвечает ДКС только по базовому
; каналу 2 (ПРП6); канал 3 проходит полную аппаратную цепочку
; (sysreq 1, ПРП12), но ответов ОС по нему не будет.  См. ОТЧЁТ_О_ТЕСТАХ.md.
;
; Запуск:  ./BIN/pdp11 BESM6/e60_R1.ini
; Терминал: telnet localhost 4301
; Журнал:   e60_R1.mux.
;
de int-flush flush_interval 1
set -n console log=e60_R1.mux
set dks enable
set dks engine=sim
set dks testos=off
set dks bridge=4141
set dks chan=3
set dks encoding=utf8
set dks debug=bridge;kadopam;ring;irq
; the trace goes into the console log (fflushed at every stop), unfiltered
set debug -F LOG
attach dks 4301
deposit 200 0777
go 200
