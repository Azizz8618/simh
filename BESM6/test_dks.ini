; Test configuration for DKS terminals
set -n console log=/tmp/besm6_log.txt
set console debug=/tmp/besm6_debug.txt
set cpu idle
set cpu autotime=on

; Drums
attach -n drum0 drum1x.bin
attach -n drum1 drum2x.bin

; Scratch disk
attach -n md06 2052.bin

; System disks
attach -e md07 sbor2053.bin
attach -e md05 krab2063.bin
attach -e md00 sbor2048.bin
attach -e md01 svs2048.bin
attach -e md02 alt2048.bin

; Printer
attach -n prn0 output.txt

; Telnet socket for all terminals
attach tty 4199

; Line 1: Main teletype (operator console)
attach tty1 console
set tty1 tt
set tty1 authbs

; Lines 2-10: VT-340 terminals
set tty2 vt
set tty3 vt
set tty4 vt
set tty5 vt
set tty6 vt
set tty7 vt
set tty8 vt
set tty9 vt
set tty10 vt

; Lines 11-16: TT via DKS (КАДОПАМ/СВЯЗЬ7) - ГЕНС: AC,TT:11-16
set tty11 tt
set tty11 dks
set tty11 authbs
set tty12 tt
set tty12 dks
set tty12 authbs
set tty13 tt
set tty13 dks
set tty13 authbs
set tty14 tt
set tty14 dks
set tty14 authbs
set tty15 tt
set tty15 dks
set tty15 authbs
set tty16 tt
set tty16 dks
set tty16 authbs

; Line 17: DKS test terminal
set tty17 vt
set tty17 dks
set tty17 authbs

; Enable TTY debugging
set tty debug

; Boot OS DISPAK
load boot_dispak.b6
run 2000
