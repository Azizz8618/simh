; test_dks_conn.ini — Минимальный тест DKS-подключения
; Первое telnet-подключение (порт 4199) идёт на tty2 (tty0=faked, tty1=console).
; tty2 = tt + dks → проверка dks_register / dks_poll / PRP_DKS_SREQ / PRP_DKS_TERMREQ
; Диск 2053 сгенерирован: ./scripts/gens.sh run gens_exp
set -n console log=/tmp/besm6_dks_conn_log.txt
set console debug=/tmp/besm6_dks_conn_debug.txt
set cpu idle
set cpu autotime=on

; Барабаны
attach -n drum0 drum1x.bin
attach -n drum1 drum2x.bin

; Рабочий диск
attach -n md06 2052.bin

; Системный диск 2053 — сгенерированный ГЕНС
attach -e md07 /usr/local/share/besm6/2053
attach -e md05 krab2063.bin
attach -e md00 sbor2048.bin
attach -e md01 svs2048.bin
attach -e md02 alt2048.bin

; Печать
attach -n prn0 /tmp/besm6_dks_conn_output.txt

; Telnet-сокет
attach tty 4199

; tty1 = консоль (занята, пропускается при tmxr_poll_conn)
attach tty1 console
set tty1 tt
set tty1 authbs

; tty2 = DKS (первая доступная линия для telnet)
; ВАЖНО: НЕ ставить "set tty2 tt" — tty_setmode для TTY_TELETYPE_STATE
; ставит .conn=1 (локальная занятая линия), и telnet уйдёт на tty3.
; DKS-линия должна оставаться свободной (conn=0).
set tty2 dks
set tty2 authbs

; Свободные линии
set tty3 authbs
set tty4 authbs
set tty5 authbs
set tty6 authbs
set tty7 authbs
set tty8 authbs
set tty9 authbs
set tty10 authbs
set tty11 authbs
set tty12 authbs
set tty13 authbs
set tty14 authbs
set tty15 authbs
set tty16 authbs
set tty17 authbs
set tty18 authbs
set tty19 authbs
set tty20 authbs
set tty21 authbs
set tty22 authbs
set tty23 authbs
set tty24 authbs

; Отладка: файл debug уже открыт выше (set console debug=...).
; "set tty debug" НЕ нужен: besm6_debug (">>> DKS: ...") пишет в debug-файл
; безусловно, а трассировка TTY даёт ~6 МБ мусора на прогон (замедляет grep).

echo ###
echo ### Загрузка ОС Диспак (диск 2053, ГЕНС gens_exp)...
echo ###

; Нулевикация ОЗУ
d -ml 1 xta, vtm 1777(1)
d -ml 2 atx (1), utm -1(1)
d -ml 3 v1m 2(1), stop
run 1

echo ###
echo ### ОЗУ обнулено. Загрузка ОС...
echo ###

load boot_dispak.b6
run 2000