set -n console log=log.txt
set console debug=debug.txt
set cpu idle
set cpu autotime=on
;set cpu debug
;set mmu debug
;set drum debug
;set md0 debug

;
; Initializing the magnetic drums.
;
attach -n drum0 drum1x.bin
attach -n drum1 drum2x.bin

;
; Initializing a scratch disk.
;
attach -n md06 2052.bin

;
; Attaching system disks.
;
attach -e md07 sbor2053.bin
attach -e md05 krab2063.bin
attach -e md00 sbor2048.bin
attach -e md01 svs2048.bin
attach -e md02 alt2048.bin

;
; Attaching an output file.
;
attach -n prn0 output.txt

;
; ===== TERMINAL CONFIGURATION =====
; Configuration matches GENS (gens.b6):
;   TT 1        - Main teletype on line 1
;   VT:1-10     - VT-340 on lines 1-10
;   AC,TT:11-16 - TT via MUX (AS) on lines 11-16
;
; Additional lines 17-24 are free for DKS or other uses
;
; Telnet socket for all terminals
;
attach tty 4199

;
; Line 1: Main teletype (operator console)
; ГЕНС: TT 1
;
attach tty1 console
set tty1 tt
set tty1 authbs

;
; Lines 2-10: VT-340 terminals (local)
; ГЕНС: VT:1-10 (line 1 is also VT but used as main TT)
;
set tty2 vt
set tty2 authbs
set tty3 vt
set tty3 authbs
set tty4 vt
set tty4 authbs
set tty5 vt
set tty5 authbs
set tty6 vt
set tty6 authbs
set tty7 vt
set tty7 authbs
set tty8 vt
set tty8 authbs
set tty9 vt
set tty9 authbs
set tty10 vt
set tty10 authbs

;
; Lines 11-16: TT via MUX (АС - apportionment station)
; ГЕНС: AC,TT:11-16
;
set tty11 tt
set tty11 mux
set tty11 authbs
set tty12 tt
set tty12 mux
set tty12 authbs
set tty13 tt
set tty13 mux
set tty13 authbs
set tty14 tt
set tty14 mux
set tty14 authbs
set tty15 tt
set tty15 mux
set tty15 authbs
set tty16 tt
set tty16 mux
set tty16 authbs

;
; Lines 17-24: Free for DKS or other terminals
; Not defined in GENS - can be used for testing
;
; DKS test terminal on line 17
set tty17 vt
set tty17 dks
set tty17 authbs

; Other free lines
set tty18 authbs
set tty19 authbs
set tty20 authbs
set tty21 authbs
set tty22 authbs
set tty23 authbs
set tty24 authbs

;
; Enable TTY debugging for DKS testing
;
set tty debug

set -n tty1 log=tty1.txt

;
; Enabling the true LRU behavior of caches
; slows down the simulation speed ~20%
;
;set mmu cache

echo ###
echo ### Zeroing out the first page of RAM (as would be entered from
echo ### switch registers after powering up the machine,
echo ### likely about once a year or less).
echo ###

d -ml 1 xta, vtm 1777(1)
d -ml 2 atx (1), utm -1(1)
d -ml 3 v1m 2(1), stop
run 1

echo ###
echo ### Done; data cache registers are displayed above. An error message
echo ### would be usually displayed there after a STOP instruction.
echo ### Naturally, at the moment they all contain zeros. Booting the OS now...
echo ###
;
; Booting OS DISPAK.
;
load boot_dispak.b6
run 2000
;quit

