; dks_os_shm.ini - эталонная связка, вариант с прямым доступом к памяти:
; БЭСМ-6 с реальной ОС Диспак, ДКС на Э-60, канал КАДОПАМ - через
; разделяемую память (POSIX shm).  Каждое 032/0132 ОС - чтение/запись
; тех самых байтов ОЗУ Э-60, звонок 077777 и АТТН (ПРП6/ПРП12) -
; счётчики в управляющем блоке сегмента.  Сети нет вовсе.
;
; Запуск (диски те же, что в dks_os_R.ini):
;
;     ./BIN/pdp11 BESM6/e60_shm0.ini   ; Э-60: ОЗУ опубликовано как /dks0
;     ./BIN/besm6  BESM6/dks_os_shm.ini
;
; Второй канал КРК: второй Э-60 с "set dks shmem=/dks1" (chan=3) и
; "set dks chans=2" здесь.  Терминалы Э-60 - telnet 4300 или, без сети,
; последовательная линия: attach dks Line=n,Connect=/dev/pts/N.

de int-flush flush_interval 1
set cpu idle
set cpu autotime=on

attach -n drum0 drum1x.bin
attach -n drum1 drum2x.bin
attach -n md06  2052.bin
attach -e md07 2053
attach -e md00 2048
attach -e md05 2095
attach -n prn0 output.txt

attach tty1 4198
set tty11 tt
set tty11 dks
set tty11 authbs
set tty12 tt
set tty12 dks
set tty12 authbs
set tty13 tt
set tty13 dks
set tty13 authbs
set tty14 tt
set tty14 dks
set tty14 authbs
set tty15 tt
set tty15 dks
set tty15 authbs
set tty16 tt
set tty16 dks
set tty16 authbs
set tty17 vt
set tty17 dks
set tty17 authbs
attach tty1 console

; ДКС: ОЗУ Э-60 - общий сегмент /dks0 (канал 2); клиент i открывает
; <имя><i>, поэтому CHANS=2 потребует и /dks1
set dks enable
set dks shmem=/dks

d -ml 1 xta, vtm 1777(1)
d -ml 2 atx (1), utm -1(1)
d -ml 3 v1m 2(1), stop
run 1
load boot_dispak.b6
run 2000
