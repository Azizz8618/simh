; Эталонная связка БЭСМ-6 <-> Э-60 (ДКС): сторона Э-60 N1 (PDP-11).
; ОЗУ Э-60, доступное БЭСМ-6 по мосту КАДОПАМ поверх TCP (порт 4140);
; telnet-порт 4300 - терминалы, подключённые к концентратору Э-60.
; Прошивка/движок СВЯЗЬ7 (ENGINE=SIM), ОС-заглушка TESTOS выключена:
; на системные запросы отвечает настоящий Диспак на БЭСМ-6
; (см. dks_os_R.ini - сторона БЭСМ-6).
;
; Запуск:  ./BIN/pdp11 BESM6/e60_R0.ini
; Терминал: telnet localhost 4300
; Журнал:   e60_R0.mux (консоль Э-60 + трасса КАДОПАМ/моста).
;
de int-flush flush_interval 1
set -n console log=e60_R0.mux
set dks enable
set dks engine=sim
set dks testos=off
set dks bridge=4140
set dks encoding=utf8
set dks debug=bridge;kadopam;ring;irq
; the trace goes into the console log (fflushed at every stop), unfiltered
set debug -F LOG
attach dks 4300
deposit 200 0777
go 200
