; Эталонная связка БЭСМ-6 <-> Э-60 (ДКС): локальный вариант - все линии
; ДКС обслуживаются в процессе БЭСМ-6 (ОЗУ Э-60 эмулируется внутри
; besm6_dks.c), отдельный симулятор Э-60 не нужен.  Терминалы - telnet
; на порт мукса 4199.
;
; Линии 11-17 переведены в режим ДКС (set ttyNN tt + set ttyNN dks) и
; "локально подключены" (conn=1) - Диспак видит их с загрузки и назначает
; терминалы 15..21(8).  Telnet-клиент занимает первую свободную линию
; мукса; чтобы отдать ему ДКС-линию, выключите её из SCP:
;   Ctrl-E -> set tty11 off -> cont
; (ОС получит системный запрос 3, освободившаяся линия станет доступна
; telnet, при подключении придёт sysreq 1 - терминал будет назначен заново).
; Пульт оператора: attach tty1 console - окно симулятора = линия T001.
;
; Файлы в текущем каталоге при запуске:
;   boot_dispak.b6  - загрузчик (копия из BESM6/OSZAGR/boot_dispak.b6);
;   2053, 2048, 2095 - образы МД (имя файла = номер тома);
;   2052.bin, drum1x.bin, drum2x.bin, output_L.txt - создаются при запуске.
; Журнал: log_L.txt (консоль БЭСМ-6 + трасса КАДОПАМ).
;
; Запуск:  ./BIN/besm6 BESM6/dks_os_L.ini
;
de int-flush flush_interval 1
set -n console log=log_L.txt
set cpu idle
set cpu autotime=on

attach -n drum0 drum1x.bin
attach -n drum1 drum2x.bin
attach -n md06 2052.bin
attach -e md07 2053
attach -e md00 2048
; the archive volume 2095 (supplied by the user): the OS asks for it
; ("УСТ.МД АРХИВА / УСТ СРЧ.К40Б2095") at boot
attach -e md05 2095
attach -n prn0 output_L.txt

attach tty1 4199
set tty2 vt
set tty3 vt
set tty4 vt
set tty5 vt
set tty6 vt
set tty7 vt
set tty8 vt
set tty9 vt
set tty10 vt
set tty11 tt
set tty11 dks
set tty11 authbs
set tty12 tt
set tty12 dks
set tty12 authbs
set tty13 tt
set tty13 dks
set tty13 authbs
set tty14 tt
set tty14 dks
set tty14 authbs
set tty15 tt
set tty15 dks
set tty15 authbs
set tty16 tt
set tty16 dks
set tty16 authbs
set tty17 vt
set tty17 dks
set tty17 authbs

attach tty1 console

set dks enable
set dks debug=kadopam;ring;irq
; the trace goes into the console (mux) log: sim_log is fflushed at
; every simulation stop, while a debug FILE would sit in a stdio
; buffer that simh never flushes; -F keeps every line (no dedup) so
; occurrence counts stay meaningful
set debug -F LOG

echo ###
echo ### Zeroing the first page of RAM
echo ###
d -ml 1 xta, vtm 1777(1)
d -ml 2 atx (1), utm -1(1)
d -ml 3 v1m 2(1), stop
run 1

echo ###
echo ### Booting OS Dispak from disk 2053
echo ###
load boot_dispak.b6
run 2000
