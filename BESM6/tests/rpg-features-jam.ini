; RPG feature test: roll overflow jam and its reset.
; Three frames of +1023 steps exceed the 2720-step normal roll, so the
; model clamps y at 2720 and raises the jam flag.  The guest stub reads
; 04170 twice: once while jammed and once after a device reset.
set pl debug=UK;GEOM;SVG
set debug debug.log
set pl1 rpg
set pl1 rpg-uk="100 300 137 337 141 137 337 141 137 337 141"
show pl1 rpg
load rpg-features-jam.b6
d PC 077700
go
ex ACC
reset
show pl1 rpg
d PC 077700
go
ex ACC
quit
