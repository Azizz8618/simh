; RPG feature test: fine step 0.0625 mm.
; The same ten-step stroke as the coarse case.  The roll limit in steps
; and the physical millimetres per step must both change in the SVG.
set pl debug=UK;GEOM;SVG
set debug debug.log
set pl1 rpg
set pl1 rpg-step=0.0625
set pl1 rpg-uk="100 052 240 141"
show pl1 rpg
set pl1 norpg
quit
