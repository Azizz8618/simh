; RPG feature test: reference plot for the autoproll pair.
; Same geometry and same finalisation as rpg-features-autoproll.ini,
; but with autoproll disabled.  The SVG viewport must stay at the stroke.
set pl debug=UK;GEOM;SVG
set debug debug.log
set pl1 rpg
set pl1 rpg-noautoproll
set pl1 rpg-uk="100 052 240 141"
show pl1 rpg
set pl1 norpg
quit
