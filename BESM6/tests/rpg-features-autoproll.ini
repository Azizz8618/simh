; RPG feature test: autoproll on.
; One real frame stroke is fed to PL1 through the rpg-uk test hook.
; NORPG finalises the plot so rpg_finish() writes rpg.svg.  Autoproll must
; advance the paper by 1240 steps (15.5 cm), which is observable as a
; wider SVG viewport and a longer physical height, with the pen up.
set pl debug=UK;GEOM;SVG
set debug debug.log
set pl1 rpg
set pl1 rpg-autoproll
set pl1 rpg-uk="100 052 240 141"
show pl1 rpg
set pl1 norpg
quit
