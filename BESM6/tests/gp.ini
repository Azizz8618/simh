; БЕНСОН-501 decoder regression test (offline unit test).
;
; The new ГП device is still being wired into SIMH, so the test feeds the
; two golden C1-line frames directly to benson_frame() instead of forming
; them with a deck.  The frames are (X=10,Y=10,pen=down) and
; (X=110,Y=110,pen=down); every pad word keeps the FOREX INTEGER tag.
; The C source carries the selftest under BESM6_GP_DECODER_SELFTEST.
;
; The expected SHA256 values are the golden values from C1-line.b6:
;   plot.dat  7b362ec4efd79e11fe0cbaebfc6de10194fa24dc7eaa76fb989f0bd445472d4c
;   benson.out cf84d96a8bf6c845f86ae136aeec66aea5060b854bb159fabe0d9988f9e9284e
;   benson.svg e505aba4e4d494ac9f9099f27160494602b6909f8309d51cb9df7bfc48748a68
;
; Working files live in /var/tmp, never in the repository.  Any failing
; command aborts the whole SIMH run via `on error exit 1` in the caller.

cd %~p0
on error exit 1

! mkdir -p /var/tmp/besm6-gp-test
! gcc -std=gnu99 -O2 -Wall -Wextra -DBESM6_GP_DECODER_SELFTEST -c ../besm6_gp_decoder.c -o /var/tmp/besm6-gp-test/besm6_gp_decoder.o
! g++ -std=c++11 -O2 -Wall -Wextra -c ../plotter.cpp -o /var/tmp/besm6-gp-test/plotter.o
! g++ -std=c++11 -O2 -Wall -Wextra -c ../plotter_bridge.cpp -o /var/tmp/besm6-gp-test/plotter_bridge.o
! g++ /var/tmp/besm6-gp-test/besm6_gp_decoder.o /var/tmp/besm6-gp-test/plotter.o /var/tmp/besm6-gp-test/plotter_bridge.o -o /var/tmp/besm6-gp-test/gp-selftest
! cd /var/tmp/besm6-gp-test && rm -f plot.dat benson.out benson.svg calcomp.out calcomp.svg && ./gp-selftest
! cd /var/tmp/besm6-gp-test && test -s plot.dat && test -s benson.out && test -s benson.svg
! cd /var/tmp/besm6-gp-test && echo '7b362ec4efd79e11fe0cbaebfc6de10194fa24dc7eaa76fb989f0bd445472d4c  plot.dat' > expect.sha && echo 'cf84d96a8bf6c845f86ae136aeec66aea5060b854bb159fabe0d9988f9e9284e  benson.out' >> expect.sha && echo 'e505aba4e4d494ac9f9099f27160494602b6909f8309d51cb9df7bfc48748a68  benson.svg' >> expect.sha && sha256sum -c expect.sha
! cd /var/tmp/besm6-gp-test && test "$(grep -c 'path d=' benson.svg)" = 2 && test ! -e calcomp.out
! cd /var/tmp/besm6-gp-test && test "$(wc -l < plot.dat)" = 128 && test "$(wc -l < benson.out)" = 228

on error ignore
echof "PASS: gp (БЕНСОН-501 decoder, golden C1-line SHA)"
