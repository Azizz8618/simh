; Phase I: автозапуск RT-11 V4.00C с канонического образа RK05.
; Запускать из рабочего каталога, содержащего проверенную копию
; rtv4_rk_boot.dsk. Имя образа относительное, путь к оригиналу не нужен.
; SHA256 канонического rtv4_rk.dsk:
; ebf0da98feffe3cd82aad95c3f4143757be512199058f996fc15e7e96c173978
;
; Подтверждено Phase F5: без BOOTEVENTS event queue не продвигается
; при плотном опросе RK из гостевого кода.
set CPU BOOTEVENTS=on
; [GAP] set RK0 AUTOBOOT
;   в текущей MTAB RK модификатора AUTOBOOT нет, автозапуск через boot RK0.
;
; Режим scaled оставлен для совместимости с Phase B.
set RK enabled
attach RK0 rtv4_rk_boot.dsk
boot RK0
go
; Если go остановился на первом событии загрузки, продолжить:
cont
