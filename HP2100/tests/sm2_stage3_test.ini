; Тест этапа 3 порта СМ-2: базовые регистры и 17-разрядный адрес.
; Запуск: ./BIN/hp2100 < HP2100/tests/sm2_stage3_test.ini

; --- РБ1 = 1 (база 01000), пользовательский режим:
;     LDA 0100 -> адрес 01100, в A должно попасть 012345
SET CPU SM2
DEPOSIT SM2PRIV 0
DEPOSIT RB1 1
DEPOSIT 1100 12345
DEPOSIT 100 0060100
DEPOSIT P 100
STEP
EXAMINE A
EXAMINE SAVEDMR

; --- РБ2 = 1 (база 0100000), привилегированный режим:
;     LDA 0100 -> адрес 0100100 (17 бит), проверяем по SAVEDMR
SET CPU SM2
DEPOSIT SM2PRIV 1
DEPOSIT RB2 1
DEPOSIT 100 0060100
DEPOSIT P 100
STEP
EXAMINE SAVEDMR

EXIT
