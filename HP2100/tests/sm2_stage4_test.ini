; Тест этапа 4 порта СМ-2: двухсловные команды.
; ВАЖНО: кодировка объявлена в sm2_params.h (GAP: точная раскладка
; бит в источнике отсутствует).
SET CPU SM2

; MPY: RA=3, множитель 5 -> произведение 15 (017), указатель 0102
DEPOSIT A 3
DEPOSIT 100 000100
DEPOSIT 101 5
DEPOSIT P 100
STEP
EXAMINE A
EXAMINE B
EXAMINE P

; LDX: загрузка РИ1 числом 0123 (бит 0 = флаг автоиндекса сброшен)
DEPOSIT 100 001104
DEPOSIT 101 123
DEPOSIT P 100
STEP
EXAMINE RI1

; DLD: двойная загрузка RA/RB из соседних ячеек
DEPOSIT 200 11111
DEPOSIT 201 22222
DEPOSIT 100 001100
DEPOSIT 101 200
DEPOSIT P 100
STEP
EXAMINE A
EXAMINE B

EXIT
