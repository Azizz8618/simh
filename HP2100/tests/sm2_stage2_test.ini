; Тест этапа 2 порта СМ-2: пропуск РНК на 2 и адрес возврата РАВ.
; Запуск: ./BIN/hp2100 < HP2100/tests/sm2_stage2_test.ini

; --- СМ-2: ISZ 0200 (память 177777 -> 0) должен пропустить 2 слова
SET CPU SM2
DEPOSIT 200 177777
DEPOSIT 100 0034200
DEPOSIT P 100
STEP
EXAMINE P
EXAMINE 200

; --- СМ-2: JSB 0200 -> РАВ = 0101, P = 0201
DEPOSIT 100 0014200
DEPOSIT P 100
STEP
EXAMINE RAV
EXAMINE P

; --- HP 2116: тот же ISZ должен пропустить 1 слово
SET CPU 2116
DEPOSIT 200 177777
DEPOSIT 100 0034200
DEPOSIT P 100
STEP
EXAMINE P

EXIT
